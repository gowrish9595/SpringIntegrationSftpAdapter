spring:
  application:
    name: spring-integration-sftp-adapter
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:sftp_adapter}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.example.sftpadapter: INFO
    org.springframework.integration: INFO

sftp-adapter:
  metadata-store:
    region: sftp-adapter
    inbox-key-prefix: "sftp-inbox:"
  local:
    inbox: ${SFTP_ADAPTER_INBOX:./data/inbox}
    processed: ${SFTP_ADAPTER_PROCESSED:./data/processed}
    error: ${SFTP_ADAPTER_ERROR:./data/error}
    signal-extension: .signal
  remote:
    data-directory: /upload/data
    signal-directory: /upload/signal
    temporary-file-suffix: .writing
  sftp:
    host: ${SFTP_HOST:localhost}
    port: ${SFTP_PORT:22}
    username: ${SFTP_USER:sftpuser}
    password: ${SFTP_PASSWORD:}
    private-key-location: ${SFTP_PRIVATE_KEY:}
    private-key-passphrase: ${SFTP_PRIVATE_KEY_PASSPHRASE:}
    allow-unknown-keys: true
  poller:
    fixed-delay: 5s
    max-messages-per-poll: 5
  retry:
    max-attempts: 4
    initial-interval: 2s
    multiplier: 2.0
    max-interval: 30s
